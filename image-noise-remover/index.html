<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT Image Noise Remover</title>
  <link rel="icon" href="./ImgConversion.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js?v=2"></script>
</head>
<body>
  <header>
    <img class="project-logo" src="./ImgConversion.svg" alt="GPT Image Noise Remover" width="56" height="56">
    <nav class="header-links" aria-label="Related links">
      <div class="paper-links">
        <a href="https://arxiv.org/abs/2608.28730" aria-label="MeanFlow paper">Research paper ↗</a>
        <a href="https://openaccess.thecvf.com/content/ICCV2021/html/Jiang_Towards_Flexible_Blind_JPEG_Artifacts_Removal_ICCV_2021_paper.html">FBCNN paper ↗</a>
      </div>
      <a class="studio-link" href="https://stevea666.github.io/">
        <img src="./waterjet.svg" alt="Waterjet Studios" width="234" height="80">
      </a>
    </nav>
  </header>
  <main>
    <h1>GPT Image Noise Remover</h1>
    <div class="workspace">
      <section class="preview" aria-label="Image comparison">
        <div class="toolbar">
          <label class="button" for="file">Open image</label>
          <input id="file" type="file" accept="image/*" class="file">
          <span id="image-info"></span>
        </div>
        <div class="stage" id="stage">
          <div id="empty"><span aria-hidden="true">↥</span><p>Drop an image here</p><small>JPEG, PNG, WebP or another browser-supported format</small></div>
          <div id="comparison" hidden>
            <canvas id="original" aria-label="Original image"></canvas>
            <canvas id="result" aria-label="Restored image" hidden></canvas>
            <span id="divider" hidden aria-hidden="true"></span>
          </div>
        </div>
        <div class="compare-controls" id="compare-controls" hidden>
          <span>Original</span><input id="split" aria-label="Comparison divider" type="range" value="50"><span>Restored</span>
        </div>
      </section>
      <aside aria-label="Restoration settings">
        <h2>Settings</h2>
        <label>Model<select id="model">
          <option value="meanflow">MeanFlow</option>
          <option value="fbcnn-color">FBCNN · Color</option>
          <option value="fbcnn-gray">FBCNN · Grayscale</option>
        </select></label>
        <div id="flow-settings">
          <label>Steps<select id="steps"><option>1</option><option selected>2</option></select></label>
          <label>Seed<input id="seed" type="number" min="0" max="4294967295" step="1" value="0"></label>
          <button type="button" id="random-seed">Randomize seed</button>
        </div>
        <label id="quality-settings" hidden><span>Intensity <output id="quality-value">40</output></span><input id="quality" type="range" min="1" max="100" value="40"></label>
        <label>Max edge<select id="edge">
          <option value="original" selected>Original size</option>
          <option value="256">256 px</option><option value="512">512 px</option>
          <option value="768">768 px</option><option value="1024">1024 px</option>
        </select></label>
        <label><span>Strength <output id="strength-value">100%</output></span><input id="strength" type="range" value="100" disabled></label>
        <button id="restore" class="primary" disabled>Restore image</button>
        <button id="save" disabled>Download PNG</button>
        <p id="status" role="status" aria-live="polite">The first run downloads the selected model (about 260–290 MB).</p>
      </aside>
    </div>
  </main>
</body>
</html>
