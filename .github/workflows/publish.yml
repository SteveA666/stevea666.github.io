name: Publish portfolio to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SteveA666/ChatGPT-Anime-Denoiser
          ref: f26c9fd59c9c21e09843a6d69b0d3b049d60a202
          path: denoiser-backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export dependencies
        run: |
          python -m pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.19.1 requests
      - name: Download and verify checkpoints
        working-directory: denoiser-backend
        run: |
          curl --fail --location --retry 3 \
            https://huggingface.co/asandeistefan/jpeg-restore-meanflows/resolve/33315831b6b342d3b8ddbdc70aa11cb84e55c66b/meanflow_jpeg_qf5_20.pth \
            --output meanflow_jpeg_qf5_20.pth
          echo "fbb573706c64ae90da85e47d1ff3377734264142460770c54ebadc50a4ba4caa  meanflow_jpeg_qf5_20.pth" | sha256sum --check
          python setup_fbcnn.py
      - name: Package portfolio and app
        run: |
          mkdir -p dist denoiser-backend/web
          git archive HEAD | tar -x -C dist --exclude=.github --exclude=test --exclude=image-noise-remover
          cp image-noise-remover/* denoiser-backend/web/
          cp denoiser-backend/LICENSE-MeanFlow denoiser-backend/LICENSE
          python denoiser-backend/web/build.py dist/image-noise-remover
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
